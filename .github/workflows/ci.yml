name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Build, test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore dependencies
        run: dotnet restore PasswordGenerator.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify formatting
        run: dotnet format PasswordGenerator.slnx --verify-no-changes --no-restore

      - name: Build without warnings
        run: dotnet build PasswordGenerator.slnx --no-restore -warnaserror

      - name: Run unit tests
        run: >-
          dotnet test tests/PasswordGenerator.UnitTests --no-build
          --settings coverlet.runsettings --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Run integration tests
        run: >-
          dotnet test tests/PasswordGenerator.IntegrationTests --no-build
          --settings coverlet.runsettings --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Consolidate coverage
        run: >-
          dotnet tool run reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:TestResults/coverage-report"
          "-reporttypes:Cobertura;TextSummary"

      - name: Verify minimum line coverage (80%)
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -CoberturaPath TestResults/coverage-report/Cobertura.xml -MinimumLineCoverage 80
